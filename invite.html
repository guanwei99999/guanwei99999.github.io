<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AirplaneBattle - Invite</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        min-height: 100vh;
        background: #0A1628;
        color: #E8EEF7;
        font-family: -apple-system, 'Segoe UI', Roboto, 'Noto Sans SC', 'Noto Sans JP', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
    }
    .card {
        width: 100%;
        max-width: 380px;
        background: #101F38;
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 16px;
        padding: 32px 24px;
        text-align: center;
    }
    .logo { font-size: 40px; line-height: 1; }
    h1 { font-size: 22px; margin: 12px 0 6px; }
    .sub { font-size: 14px; color: rgba(255,255,255,0.65); margin-bottom: 20px; line-height: 1.6; }
    .pin {
        display: inline-block;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 8px;
        padding: 10px 20px 10px 28px;
        margin-bottom: 20px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 10px;
    }
    .btn {
        display: block;
        width: 100%;
        padding: 14px;
        margin-bottom: 12px;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        text-decoration: none;
    }
    .btn-primary { background: #2FA8FF; color: #062033; }
    .btn-store { background: rgba(255,255,255,0.1); color: #E8EEF7; border: 1px solid rgba(255,255,255,0.25); }
    .hint { font-size: 12px; color: rgba(255,255,255,0.5); line-height: 1.7; margin-top: 8px; }
    .bad { color: #F09595; }
</style>
</head>
<body>
<div class="card">
    <div class="logo">✈️</div>
    <h1 id="t_title">AirplaneBattle</h1>
    <p class="sub" id="t_sub">朋友邀请你来对战</p>
    <div class="pin" id="pinBox">----</div>
    <a class="btn btn-primary" id="btnOpen" href="#">打开游戏</a>
    <a class="btn btn-store" id="btnStore" href="https://play.google.com/store/apps/details?id=com.airbattle.airplane">Google Play 下载</a>
    <p class="hint" id="t_hint">点「打开游戏」后自动填入配对码并开始配对<br>若浏览器询问，请允许离开当前页面</p>
</div>
<script>
(function () {
    var pin = '';
    try { pin = (new URLSearchParams(location.search).get('pin') || '').replace(/\D/g, ''); } catch (e) {}
    if (pin.length !== 4) pin = '';
    var valid = !!pin;

    var L = (navigator.language || 'zh').slice(0, 2).toLowerCase();
    var TEXT = {
        zh: { sub: '朋友邀请你来对战', open: '打开游戏', store: 'Google Play 下载',
              hint: '点「打开游戏」后自动填入配对码并开始配对<br>若浏览器询问，请允许离开当前页面',
              bad: '邀请链接无效：缺少 4 位配对码' },
        en: { sub: 'A friend invited you to battle', open: 'Open Game', store: 'Get it on Google Play',
              hint: 'Tapping "Open Game" auto-fills the code and starts pairing<br>If asked, allow leaving this page',
              bad: 'Invalid invite: missing 4-digit code' },
        ja: { sub: '友達から対戦の招待が届きました', open: 'ゲームを開く', store: 'Google Play で入手',
              hint: '「ゲームを開く」をタップするとコードを自動入力してペアリングします<br>確認が出たらページの遷移を許可してください',
              bad: '招待リンクが無効です：4桁のコードがありません' }
    };
    var t = TEXT[L] || TEXT.zh;

    document.getElementById('t_sub').textContent = t.sub;
    document.getElementById('btnOpen').textContent = t.open;
    document.getElementById('btnStore').textContent = t.store;
    document.getElementById('t_hint').innerHTML = t.hint;

    if (valid) {
        document.getElementById('pinBox').textContent = pin;
        document.getElementById('btnOpen').href = 'airplane://join?pin=' + pin;
    } else {
        document.getElementById('pinBox').textContent = '----';
        document.getElementById('pinBox').classList.add('bad');
        document.getElementById('btnOpen').style.opacity = '0.4';
        document.getElementById('btnOpen').style.pointerEvents = 'none';
        document.getElementById('t_hint').innerHTML = '<span class="bad">' + t.bad + '</span>';
    }
})();
</script>
</body>
</html>
